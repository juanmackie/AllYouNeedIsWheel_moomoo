                  React.createElement("span", { style: { fontFamily: FT.fontMono, fontSize: 13, textAlign: "right" } }, p.roll.newExpiry.slice(5)),
                  React.createElement("span", { style: { fontFamily: FT.fontBody, fontSize: 12, color: FT.inkMute } }, "New DTE"),
                  React.createElement("span", { style: { fontFamily: FT.fontMono, fontSize: 13, textAlign: "right" } }, p.roll.newDte + "d"),
                  React.createElement("span", { style: { fontFamily: FT.fontBody, fontSize: 12, color: FT.inkMute } }, "Debit"),
                  React.createElement("span", { style: { fontFamily: FT.fontMono, fontSize: 13, textAlign: "right", color: FT.down } }, "-$" + p.roll.estDebit.toFixed(2)),
                  React.createElement("span", { style: { fontFamily: FT.fontBody, fontSize: 12, color: FT.inkMute } }, "Net Credit"),
                  React.createElement("span", { style: { fontFamily: FT.fontMono, fontSize: 13, textAlign: "right", color: FT.signal, fontWeight: 600 } }, "+$" + p.roll.netCredit.toFixed(2))
                )
              ) : (
                React.createElement("div", {
                  style: { paddingTop: 14, fontFamily: FT.fontBody, fontSize: 13, color: FT.inkMute, lineHeight: 1.5, fontStyle: "italic" }
                }, "No roll recommended. Hold current position.")
              )
            ),
            // Why
            React.createElement("div", { style: { padding: "20px 0 20px 24px" } },
              React.createElement(Eyebrow, null, "Why"),
              React.createElement("p", {
                style: { margin: 0, paddingTop: 8, fontFamily: FT.fontBody, fontSize: 13, color: FT.inkSoft, lineHeight: 1.55, maxWidth: 460 }
              }, p.rationale)
            )
          )
        );
      }

      return (
        React.createElement("div", { style: { padding: "0 48px 64px" } },
          React.createElement(SectionHeader, {
            num: "01 \u00B7 AT-RISK",
            title: "Positions needing attention",
            caption: (urgentCount + watchCount) + " of " + DATA.rollPositions.length + " positions reviewed. " + urgentCount + " urgent (roll within 24h), " + watchCount + " on watch."
          }),
          React.createElement("div", { style: { marginTop: 24 } },
            DATA.rollPositions.map(function(p) {
              return React.createElement(Row, { key: p.id, p: p });
            })
          ),

          React.createElement(SectionHeader, {
            num: "02 \u00B7 PLAYBOOK",
            title: "How rolls are scored",
            caption: "Rolls are suggested only when the net credit (new - close cost) keeps annualized return above 12% AND moves DTE out by at least 14 days."
          }),
          React.createElement("div", {
            style: { display: "grid", gridTemplateColumns: "repeat(3, 1fr)", borderTop: R1, borderBottom: R1 }
          },
            [
              { l: "Threshold", v: "12% min", s: "Net ann. return" },
              { l: "Time Ext.", v: "+14d", s: "Minimum DTE push-out" },
              { l: "Strike Lift", v: "0.5 sigma", s: "Min OTM distance gain" },
            ].map(function(c, i) {
              return React.createElement("div", {
                key: c.l,
                style: {
                  padding: "24px 24px 24px 0",
                  borderRight: i < 2 ? RS : "none",
                  paddingRight: i < 2 ? 24 : 0,
                }
              },
                React.createElement(Eyebrow, null, c.l),
                React.createElement("div", {
                  style: {
                    paddingTop: 8, fontFamily: FT.fontDisplay, fontWeight: 600,
                    fontSize: 36, lineHeight: 1, letterSpacing: "-0.02em",
                  }
                }, c.v),
                React.createElement("div", { style: { paddingTop: 6 } }, React.createElement(Mono, { size: 11, color: FT.inkMute }, c.s))
              );
            })
          ),

          React.createElement("div", { style: { paddingTop: 64 } },
            React.createElement(SoftRule, null),
            React.createElement("div", { style: { display: "flex", justifyContent: "space-between", padding: "14px 0" } },
              React.createElement(Mono, { size: 10, color: FT.inkFaint, style: { textTransform: "uppercase", letterSpacing: "0.16em" } },
                "Roll recommendations refreshed 2026-06-06 14:32 ET"
              ),
              React.createElement(Mono, { size: 10, color: FT.inkFaint, style: { textTransform: "uppercase", letterSpacing: "0.16em" } },
                "Review only -- orders placed in your broker"
              )
            )
          )
        )
      );
    }

    /* ===========================================================
       8. APP ROOT
       =========================================================== */
    function App() {
      const [page, setPage] = useState("dashboard");
      return (
        React.createElement("div", { className: "stage", style: { width: 1280 } },
          React.createElement(Masthead, { page: page, onPage: setPage }),
          page === "dashboard" ? React.createElement(Dashboard, null) : null,
          page === "portfolio" ? React.createElement(Portfolio, null) : null,
          page === "rollover" ? React.createElement(Rollover, null) : null
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, null));
  </script>
</body>
