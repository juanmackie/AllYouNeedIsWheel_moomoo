[project]
name = "allyouneediswheel-moomoo"
version = "1.0.0"
description = "The Wheel Strategy options trading system for Moomoo OpenD"
requires-python = ">=3.10"
dependencies = [
    "moomoo-api>=10.1.6108",
    "flask>=3.0.2",
    "yfinance>=0.2.28",
    "pandas>=2.2.0",
    "cachetools>=5.3.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.4",
    "python-dotenv>=1.1.0",
    "pytz>=2024.1",
    "fredapi>=0.4.2",
    "flask-cors>=4.0.0",
    "gunicorn>=21.2.0",
    "waitress>=2.1.2",
    "werkzeug>=3.0.1",
    "tvscreener>=0.2.0",
    "openai>=1.0.0",
    "scipy>=1.12.0",
    "apscheduler>=3.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_tmp", ".pytest_cache", ".ruff_cache", ".venv", "venv", "logs"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*", "_tmp/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
select = ["F", "E", "W", "I"]
ignore = ["E501", "F811"]
line-length = 120
