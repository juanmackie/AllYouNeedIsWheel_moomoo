[project]
name = "allyouneediswheel-moomoo"
version = "1.0.0"
description = "The Wheel Strategy options trading system for Moomoo OpenD"
requires-python = ">=3.10"
dependencies = [
    "moomoo-api>=10.1.6108",
    "flask>=3.0.2",
    "yfinance>=0.2.28",
    "python-dotenv>=1.1.0",
    "waitress>=2.1.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "db*"]

exclude = ["tests*", "frontend*"]

[dependency-groups]
dev = [
    "pandas>=2.2.0",
    "pytest>=7.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_tmp", ".pytest_cache", ".ruff_cache", ".venv", "venv", "logs"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*", "_tmp/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "F811"]

[tool.ruff.lint.per-file-ignores]
# app.py must load .env before project imports read configuration at import time
"app.py" = ["E402"]