name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-quality-gate:
    name: Windows quality gate (backend, frontend, hygiene)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.x"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync locked Python environment
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Dependency drift check (pyproject vs requirements.txt)
        run: |
          @'
          import re, tomllib
          from pathlib import Path
          with open("pyproject.toml", "rb") as fh:
              py_deps = set(re.split(r"[<>=!~;]", d.strip())[0].lower()
                            for d in tomllib.load(fh)["project"]["dependencies"])
          req_deps = set()
          for line in Path("requirements.txt").read_text().splitlines():
              line = line.split("#")[0].strip()
              if not line or line.startswith("-"):
                  continue
              req_deps.add(re.split(r"[<>=!~;]", line)[0].strip().lower())
          missing = py_deps - req_deps
          extra = req_deps - py_deps
          assert not missing, f"requirements.txt missing: {sorted(missing)}"
          assert not extra, f"requirements.txt has extras not in pyproject: {sorted(extra)}"
          print("dependency drift check: OK", len(py_deps), "deps aligned")
          '@ | uv run python -

      - name: Backend tests (locked env)
        run: uv run python scripts/ci_pytest.py tests/ -q

      - name: Frontend tests
        run: |
          npm ci
          npm test --silent

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Start local app for browser smoke
        run: |
          $env:CONNECTION_CONFIG = "connection.json.example"
          $process = Start-Process -FilePath "uv.exe" `
            -ArgumentList @("run", "python", "app.py") `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput "e2e-ci-server.log" `
            -RedirectStandardError "e2e-ci-server-error.log" `
            -PassThru
          "E2E_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) {
            Get-Content e2e-ci-server-error.log -ErrorAction SilentlyContinue
            throw "Local app did not become ready for E2E smoke"
          }

      - name: Browser E2E smoke
        run: npm run test:e2e

      - name: Stop local app
        if: always()
        run: |
          if ($env:E2E_PID) {
            taskkill /PID $env:E2E_PID /T /F 2>$null
          }

      - name: Hygiene scan — no order-capable runtime surface
        run: |
          uv run pytest tests/test_no_execution_surface.py tests/test_query_only_broker.py -q
          Write-Host "hygiene scan: no order-capable runtime surface found"

      - name: Hygiene scan — no tracked generated artifacts
        run: |
          $bad = git ls-files | Where-Object {
            $_ -match '(^|/)(node_modules|__pycache__|\.pytest_cache|\.ruff_cache|\.venv|logs?)/' -or
            $_ -match '\.(db|db-wal|db-shm|pyc|log)$' -or
            (($_ -match '(^|/)\.env($|\.)') -and ($_ -notmatch '(^|/)\.env\.example$')) -or
            $_ -match '(^|/)(plan\.md|\.pi-subagents)(/|$)' -or
            $_ -match '(^|/)\.claude(/|$)' -or
            $_ -match '(^|/)\.pi(/|$)' -or
            $_ -match '(^|/)settings\.local\.json$' -or
            $_ -match '(^|/).*\.local\.md$' -or
            $_ -match 'production-ready-vibe-coding-rules' -or
            $_ -match 'opend-skills'
          }
          if ($bad) { Write-Error "tracked artifacts:"; $bad | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "hygiene scan: no tracked generated artifacts"

      - name: Fresh-clone smoke (backend import + health endpoint)
        run: |
          $tmp = Join-Path $env:TEMP "ayniw-smoke-$([guid]::NewGuid().ToString('N'))"
          git clone -q . $tmp
          Push-Location $tmp
          uv sync --locked --all-groups
          uv run python -c "from app import create_application; app = create_application(); print('app import OK')"
          Pop-Location
          Remove-Item -Recurse -Force $tmp
