name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run tests
      run: |
        pytest tests/ -v

    - name: Lint with ruff (narrow)
      run: |
        pip install ruff
        ruff check . --select=F --ignore=F811 --exit-zero

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Check for secrets in code
      run: |
        # Simple check for common patterns that might indicate secrets
        if grep -r "api_key\|password\|secret" --include="*.py" --include="*.js" . | grep -v ".venv" | grep -v "__pycache__" | grep -v ".git"; then
          echo "WARNING: Potential secrets found in code. Review carefully."
        fi
