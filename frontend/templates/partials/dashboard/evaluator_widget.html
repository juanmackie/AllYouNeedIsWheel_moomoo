<section id="evaluator-widget" class="mt-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0 fs-6 fw-semibold">Evaluator &amp; Calibrator</h5>
      <div>
        <button id="refresh-evaluator-btn" class="btn btn-outline-secondary btn-sm" title="Refresh evaluator stats">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
      </div>
    </div>
    <div class="card-body">
      <div id="evaluator-loading" class="text-muted small py-2">Loading evaluator data...</div>
      <div id="evaluator-content" class="d-none">
        <div class="row g-2">
          <!-- Summary stats -->
          <div class="col-6 col-md-3">
            <div class="small text-muted">Tracked</div>
            <div class="fs-5 fw-semibold" id="eval-total">-</div>
          </div>
          <div class="col-6 col-md-3">
            <div class="small text-muted">Resolved</div>
            <div class="fs-5 fw-semibold" id="eval-resolved">-</div>
          </div>
          <div class="col-6 col-md-3">
            <div class="small text-muted">Assignment Rate</div>
            <div class="fs-5 fw-semibold" id="eval-assignment-rate">-</div>
          </div>
          <div class="col-6 col-md-3">
            <div class="small text-muted">Expiry Rate</div>
            <div class="fs-5 fw-semibold" id="eval-expiry-rate">-</div>
          </div>
        </div>

        <hr class="my-2">

        <!-- Feedback bias summary -->
        <div class="row g-2">
          <div class="col-6">
            <div class="small text-muted">Over-predicting Factors</div>
            <div class="small" id="eval-over-factors">-</div>
          </div>
          <div class="col-6">
            <div class="small text-muted">Under-predicting Factors</div>
            <div class="small" id="eval-under-factors">-</div>
          </div>
        </div>

        <hr class="my-2">

        <!-- Calibration summary -->
        <div id="calibration-section">
          <div class="row g-2">
            <div class="col-6">
              <div class="small text-muted">Latest Calibration</div>
              <div class="small" id="eval-calibration-msg">Not yet run</div>
            </div>
            <div class="col-6">
              <div class="small text-muted">Calibration Loss</div>
              <div class="small" id="eval-calibration-loss">-</div>
            </div>
          </div>
        </div>

        <hr class="my-2">

        <!-- Scheduler state -->
        <div class="row g-2">
          <div class="col-6">
            <div class="small text-muted">Scheduler</div>
            <div class="small" id="eval-scheduler-status">-</div>
          </div>
          <div class="col-6">
            <div class="small text-muted">Last Evaluator Run</div>
            <div class="small" id="eval-last-run">-</div>
          </div>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-6">
            <div class="small text-muted">Last Calibrator Run</div>
            <div class="small" id="eval-calibrator-run">-</div>
          </div>
        </div>
      </div>
      <div id="evaluator-error" class="d-none text-danger small py-2">Failed to load evaluator data.</div>
    </div>
  </div>
</section>
