<section class="app-section earnings-vol-stage" id="earnings-vol-signals-section">
    <div class="app-section__header">
        <div>
            <span class="app-section__eyebrow">Read-only signal lab</span>
            <h2>Earnings vol signals</h2>
            <p>Research plans for ATM calendar spreads around earnings. These are research signals only, not trade orders.</p>
        </div>
        <div class="app-section__actions">
            <small id="earnings-vol-last-updated" class="text-muted d-none"></small>
            <button id="refresh-earnings-vol-signals" class="btn btn-outline-primary btn-sm" type="button">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>

    <div id="earnings-vol-state"></div>
    <div id="earnings-vol-content" class="earnings-vol-grid d-none"></div>

    <div class="app-section__footer">
        <span class="text-success">Qualified</span> is researchable now (0-10d to earnings, positive edge). <span class="text-info">Watch</span> is early or incomplete. <span class="text-secondary">Avoid</span> means no current edge or missing data.
    </div>
</section>

<template id="earnings-vol-card-template">
    <article class="earnings-vol-card">
        <div class="earnings-vol-card__header">
            <div>
                <strong class="earnings-vol-card__ticker"></strong>
                <small class="earnings-vol-card__date text-muted"></small>
                <small class="earnings-vol-card__source text-muted d-block" style="font-size:0.65rem;"></small>
            </div>
            <span class="earnings-vol-card__signal badge"></span>
        </div>

        <div class="earnings-vol-card__score">
            <span class="earnings-vol-card__score-value"></span>
            <span class="earnings-vol-card__score-label">signal score</span>
        </div>

        <div class="earnings-vol-card__setup">
            <div class="earnings-vol-card__setup-row">
                <span class="earnings-vol-card__setup-label">Setup</span>
                <strong class="earnings-vol-card__setup-value earnings-vol-card__structure"></strong>
            </div>
            <div class="earnings-vol-card__setup-row">
                <span class="earnings-vol-card__setup-label">Strike</span>
                <strong class="earnings-vol-card__setup-value earnings-vol-card__strike"></strong>
            </div>
            <div class="earnings-vol-card__setup-row">
                <span class="earnings-vol-card__setup-label">Sell</span>
                <strong class="earnings-vol-card__setup-value earnings-vol-card__sell"></strong>
            </div>
            <div class="earnings-vol-card__setup-row">
                <span class="earnings-vol-card__setup-label">Buy</span>
                <strong class="earnings-vol-card__setup-value earnings-vol-card__buy"></strong>
            </div>
            <div class="earnings-vol-card__setup-row">
                <span class="earnings-vol-card__setup-label">Debit</span>
                <strong class="earnings-vol-card__setup-value earnings-vol-card__debit"></strong>
            </div>
        </div>

        <div class="earnings-vol-card__plan">
            <div class="earnings-vol-card__plan-row">
                <span class="earnings-vol-card__plan-label">Entry</span>
                <span class="earnings-vol-card__plan-value earnings-vol-card__entry"></span>
            </div>
            <div class="earnings-vol-card__plan-row">
                <span class="earnings-vol-card__plan-label">Exit</span>
                <span class="earnings-vol-card__plan-value earnings-vol-card__exit"></span>
            </div>
            <div class="earnings-vol-card__plan-row">
                <span class="earnings-vol-card__plan-label">Target</span>
                <span class="earnings-vol-card__plan-value earnings-vol-card__target"></span>
            </div>
            <div class="earnings-vol-card__plan-row">
                <span class="earnings-vol-card__plan-label">Cut if</span>
                <span class="earnings-vol-card__plan-value earnings-vol-card__cut"></span>
            </div>
        </div>

        <div class="earnings-vol-card__metrics">
            <div>
                <span>Front/back IV</span>
                <strong class="earnings-vol-card__iv"></strong>
            </div>
            <div>
                <span>IV/RV</span>
                <strong class="earnings-vol-card__ivrv"></strong>
            </div>
            <div>
                <span>Spread</span>
                <strong class="earnings-vol-card__spread"></strong>
            </div>
            <div>
                <span>Max risk</span>
                <strong class="earnings-vol-card__risk"></strong>
            </div>
        </div>

        <div class="earnings-vol-card__notes"></div>
    </article>
</template>
