<section class="app-section earnings-vol-stage" id="earnings-vol-signals-section">
    <div class="app-section__header">
        <div>
            <span class="app-section__eyebrow">Read-only signal lab</span>
            <h2>Earnings vol signals</h2>
            <p>Simple labels for earnings volatility setups. These are research signals only, not trade orders.</p>
        </div>
        <div class="app-section__actions">
            <small id="earnings-vol-last-updated" class="text-muted d-none"></small>
            <button id="refresh-earnings-vol-signals" class="btn btn-outline-primary btn-sm" type="button">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>

    <div id="earnings-vol-state"></div>
    <div id="earnings-vol-content" class="earnings-vol-grid d-none"></div>

    <div class="app-section__footer">
        Green means the setup deserves research. Avoid means the app sees a missing edge, bad liquidity, or incomplete data.
    </div>
</section>

<template id="earnings-vol-card-template">
    <article class="earnings-vol-card">
        <div class="earnings-vol-card__header">
            <div>
                <strong class="earnings-vol-card__ticker"></strong>
                <small class="earnings-vol-card__date text-muted"></small>
                <small class="earnings-vol-card__source text-muted d-block" style="font-size:0.65rem;"></small>
            </div>
            <span class="earnings-vol-card__signal badge"></span>
        </div>

        <div class="earnings-vol-card__score">
            <span class="earnings-vol-card__score-value"></span>
            <span class="earnings-vol-card__score-label">signal score</span>
        </div>

        <div class="earnings-vol-card__metrics">
            <div>
                <span>Front/back IV</span>
                <strong class="earnings-vol-card__iv"></strong>
            </div>
            <div>
                <span>IV/RV</span>
                <strong class="earnings-vol-card__ivrv"></strong>
            </div>
            <div>
                <span>Spread</span>
                <strong class="earnings-vol-card__spread"></strong>
            </div>
            <div>
                <span>Max debit risk</span>
                <strong class="earnings-vol-card__risk"></strong>
            </div>
        </div>

        <div class="earnings-vol-card__notes"></div>
    </article>
</template>
