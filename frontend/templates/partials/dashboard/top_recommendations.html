<section class="app-section recommendation-stage" id="top-recommendations-section">
    <div class="app-section__header">
        <div>
            <span class="app-section__eyebrow">Opportunity desk</span>
            <h2>Top recommendations</h2>
            <p>Highest-conviction wheel candidates ranked by risk-adjusted return, liquidity, and volatility.</p>
        </div>
        <div class="app-section__actions">
            <small id="top-recs-last-updated" class="text-muted d-none"></small>
            <button id="refresh-top-recommendations" class="btn btn-outline-primary btn-sm" type="button">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>

    <div id="top-recommendations-container" class="recommendation-stage__body">
        <div id="top-recommendations-state"></div>
        <div id="top-recommendations-content" class="d-none">
            <div id="lanes-covered-calls-section" class="mb-3 d-none">
                <h6 class="text-muted text-uppercase small fw-semibold mb-2">
                    <i class="bi bi-graph-up-arrow text-success"></i> Covered Calls
                </h6>
                <div class="row g-2" id="lanes-covered-calls-cards"></div>
            </div>
            <div id="lanes-watchlist-csp-section" class="mb-3 d-none">
                <h6 class="text-muted text-uppercase small fw-semibold mb-2">
                    <i class="bi bi-shield-check text-danger"></i> Watchlist Cash-Secured Puts
                </h6>
                <div class="row g-2" id="lanes-watchlist-csp-cards"></div>
            </div>
            <div id="top-recommendations-cards" class="row g-2"></div>
        </div>
    </div>

    <div class="app-section__footer">
        Recommendations account for your existing positions and only show contracts you can realistically sell.
    </div>
</section>

<template id="recommendation-card-template">
    <div class="col-lg-4">
        <article class="recommendation-card h-100">
            <div class="card-body">
                <div class="recommendation-card__header-row">
                    <div class="d-flex align-items-center gap-2">
                        <span class="rank-badge fs-6 fw-bold"></span>
                        <span class="ticker-badge fw-bold"></span>
                    </div>
                    <span class="option-type-badge badge"></span>
                </div>

                <div class="recommendation-card__hero">
                    <h3 class="strike-price mb-1"></h3>
                    <small class="expiration-date text-muted"></small>
                    <div class="dte-badge badge mt-1"></div>
                </div>

                <div class="row g-1 mb-2">
                    <div class="col-6 text-center">
                        <small class="text-muted d-block">Premium</small>
                        <span class="premium-amount fw-bold fs-5"></span>
                        <small class="text-muted d-block">per contract</small>
                    </div>
                    <div class="col-6 text-center">
                        <small class="text-muted d-block">Annualized</small>
                        <span class="annualized-return fw-bold fs-5"></span>
                    </div>
                </div>

                <div class="d-flex justify-content-center mb-2">
                    <span class="score-badge fs-6"></span>
                </div>

                <div class="recommendation-warnings small mb-2"></div>

                <div class="recommendation-details">
                    <div class="d-flex justify-content-between">
                        <span>OTM</span>
                        <span class="otm-pct fw-semibold"></span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Delta</span>
                        <span class="delta-value fw-semibold"></span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>IV Rank</span>
                        <span class="iv-rank fw-semibold"></span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Macro</span>
                        <span class="macro-impact fw-semibold"></span>
                    </div>
                </div>
            </div>
            <div class="card-footer bg-transparent border-0 pt-0">
                <div class="d-grid gap-1">
                    <button class="btn btn-outline-primary btn-sm add-order-btn" type="button">
                        <i class="bi bi-plus-lg"></i> Stage
                    </button>
                    <button class="btn btn-success btn-sm execute-now-btn" type="button">
                        <i class="bi bi-lightning-charge-fill"></i> Execute
                    </button>
                </div>
            </div>
        </article>
    </div>
</template>
