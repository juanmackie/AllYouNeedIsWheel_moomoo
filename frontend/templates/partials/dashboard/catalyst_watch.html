<section class="app-section catalyst-stage" id="catalyst-watch-section">
    <div class="app-section__header">
        <div>
            <span class="app-section__eyebrow">Research-only</span>
            <h2>Catalyst Watch</h2>
            <p>Unusual options flow that may indicate pre-catalyst positioning. These are research signals only.</p>
        </div>
        <div class="app-section__actions">
            <small id="catalyst-last-updated" class="text-muted d-none"></small>
            <button id="refresh-catalyst-signals" class="btn btn-outline-primary btn-sm" type="button">Refresh</button>
            <button id="sensitive-catalyst-scan" class="btn btn-outline-warning btn-sm" type="button">Sensitive</button>
        </div>
    </div>

    <div id="catalyst-state"></div>
    <div id="catalyst-content" class="catalyst-grid d-none"></div>

    <div class="app-section__footer">
        <span class="text-success">Priority lead</span> &mdash; fresh premium, low hedge, concentrated.
        <span class="text-info">Moderate</span> &mdash; some signals but hedged or moderate scale.
        <span class="text-secondary">Low</span> &mdash; minor activity, not actionable.
    </div>
</section>

<template id="catalyst-card-template">
    <article class="catalyst-card">
        <div class="catalyst-card__header">
            <div>
                <strong class="catalyst-card__ticker"></strong>
                <span class="catalyst-card__direction badge ms-1"></span>
            </div>
            <span class="catalyst-card__signal badge"></span>
        </div>

        <div class="catalyst-card__action banner small"></div>

        <div class="catalyst-card__conflict-warning small text-warning d-none"></div>

        <div class="catalyst-card__score">
            <span class="catalyst-card__score-value"></span>
            <span class="catalyst-card__score-label">flow score</span>
        </div>

        <div class="catalyst-card__metrics">
            <div>
                <span>Premium notional</span>
                <strong class="catalyst-card__premium"></strong>
            </div>
            <div>
                <span>Fresh vol/OI</span>
                <strong class="catalyst-card__fresh"></strong>
            </div>
            <div>
                <span>OTM</span>
                <strong class="catalyst-card__otm"></strong>
            </div>
            <div>
                <span>Strike</span>
                <strong class="catalyst-card__strike"></strong>
            </div>
        </div>

        <div class="catalyst-card__extra">
            <div class="catalyst-card__extra-row">
                <span>Expiration concentration</span>
                <strong class="catalyst-card__cluster"></strong>
            </div>
            <div class="catalyst-card__extra-row">
                <span>Hedged</span>
                <strong class="catalyst-card__hedged"></strong>
            </div>
            <div class="catalyst-card__extra-row">
                <span>Earnings</span>
                <strong class="catalyst-card__earnings"></strong>
            </div>
        </div>

        <div class="catalyst-card__interpretation small text-muted"></div>
        <div class="catalyst-card__rationale small text-muted"></div>
        <div class="catalyst-card__blockers small text-danger"></div>
        <div class="catalyst-card__social small text-info d-none"></div>
        <div class="catalyst-card__overlay small text-muted d-none"></div>
    </article>
</template>
