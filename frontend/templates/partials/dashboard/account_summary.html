<section class="app-section dashboard-summary-section">
    <div class="dashboard-summary-grid">
        <div class="summary-panel">
            <div class="summary-panel__header">
                <div>
                    <span class="app-section__eyebrow">Portfolio</span>
                    <h2>Capital & risk</h2>
                </div>
                <div id="data-status-container" class="d-flex align-items-center gap-2">
                    <div id="opend-status" class="d-flex align-items-center gap-1">
                        <span id="data-status-icon">
                            <i class="bi bi-lightning-fill"></i>
                        </span>
                        <span id="data-status-indicator" class="badge bg-secondary">OPEND: LOADING</span>
                    </div>
                    <div id="earnings-status" class="d-flex align-items-center gap-1 border-start ps-2">
                        <span class="text-muted small"><i class="bi bi-calendar-event"></i></span>
                        <span id="earnings-status-indicator" class="badge bg-secondary">EARNINGS: ...</span>
                        <button id="refresh-earnings-btn" class="btn btn-link btn-sm p-0 ms-1 text-primary" title="Refresh all earnings manually">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <small id="data-update-time" class="text-muted flex-shrink-0"></small>
                </div>
            </div>

            <div class="summary-metrics-grid">
                <div class="summary-metric-cell">
                    <p class="summary-metric-label">Total Value</p>
                    <h3 class="summary-metric-value" id="account-value">$0.00</h3>
                </div>
                <div class="summary-metric-cell">
                    <p class="summary-metric-label">Cash Balance</p>
                    <h3 class="summary-metric-value" id="cash-balance">$0.00</h3>
                </div>
                <div class="summary-metric-cell">
                    <p class="summary-metric-label">Buying Power</p>
                    <h3 class="summary-metric-value" id="excess-liquidity">$0.00</h3>
                </div>
                <div class="summary-metric-cell">
                    <p class="summary-metric-label">Initial Margin</p>
                    <h3 class="summary-metric-value" id="initial-margin">$0.00</h3>
                </div>
                <div class="summary-metric-cell">
                    <p class="summary-metric-label">Leverage</p>
                    <h3 class="summary-metric-value" id="leverage-percentage">0.00%</h3>
                </div>
            </div>

            <div class="summary-leverage-panel">
                <div class="progress leverage-bar-height">
                    <div id="leverage-bar" class="progress-bar" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        </div>

        <div class="summary-panel summary-panel--accent">
            <span class="app-section__eyebrow">Weekly income</span>
            <h2>Option premium</h2>
            <div class="summary-income-grid">
                <div class="summary-income-metric">
                    <p class="summary-income-label">Weekly premium</p>
                    <h3 class="summary-income-value mb-0" id="weekly-income-summary">$0.00</h3>
                    <p class="summary-income-caption mb-0">
                        <span id="weekly-positions-count">0</span> positions expiring
                        <span id="friday-date">this Friday</span>
                    </p>
                </div>
                <div class="summary-income-metric">
                    <p class="summary-income-label">Open short premium</p>
                    <h3 class="summary-income-value mb-0" id="open-short-income-summary">$0.00</h3>
                    <p class="summary-income-caption mb-0">
                        <span id="open-short-contracts-count">0</span> contracts open
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
