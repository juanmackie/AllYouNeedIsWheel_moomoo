<section class="run-strip" id="run-strip" aria-label="Operational status">
    <span class="badge bg-secondary" id="run-env">ENV --</span>
    <span class="badge badge--dark" id="run-readonly" title="Structurally read-only: no order/unlock surface exists">READ-ONLY</span>
    <span class="badge bg-secondary" id="run-preset">PRESET --</span>
    <span class="badge bg-secondary" id="run-market">MARKET --</span>
    <span class="badge bg-secondary" id="run-status">RUN --</span>
    <span class="small text-muted" id="run-last-success">no successful run yet</span>
    <span class="small text-muted" id="run-coverage"></span>
    <span class="small text-muted" id="run-freshness"></span>
    <button id="run-refresh-btn" class="btn btn-outline-primary btn-sm ms-auto" type="button">
        <i class="bi bi-arrow-clockwise"></i> Refresh run
    </button>
</section>
<div id="run-warning-banner" class="alert d-none mb-3" role="alert" aria-atomic="true">
    <strong id="run-warning-title" class="d-block"></strong>
    <div id="run-warning-reason"></div>
    <div id="run-warning-action" class="small mt-2"></div>
</div>
